<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs · Night Shift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239b7bff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="doc">
<main id="main"><div class="wrap layout">
  <div><div id="crumbs" class="crumbs"></div><article class="md" id="content"><p class="muted">Loading…</p></article></div>
  <aside><div class="box"><h4>On this page</h4><ul id="toc"></ul><h4 style="margin-top:16px">All docs</h4><ul id="all"></ul></div></aside>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var N = window.NS, id = new URLSearchParams(location.search).get("doc") || "night-shift", el = document.getElementById("content");
  N.getJSON("data/docs.json").then(function (d) {
    var doc = d.docs.filter(function (x) { return x.id === id; })[0];
    document.getElementById("all").innerHTML = d.docs.map(function (x) { return '<li><a href="doc.html?doc=' + x.id + '"' + (x.id === id ? ' aria-current="page" style="color:var(--accent)"' : "") + ">" + N.esc(x.title) + "</a></li>"; }).join("");
    if (!doc) { el.innerHTML = "<h1>Document not found</h1>"; return; }
    document.title = doc.title + " · Night Shift";
    document.getElementById("crumbs").innerHTML = '<a href="index.html">Home</a> / Docs / ' + N.esc(doc.title);
    return fetch("content/docs/" + doc.file).then(function (r) { if (!r.ok) throw new Error(doc.file + " " + r.status); return r.text(); }).then(function (md) { return N.renderMarkdown(el, md); }).then(function () { N.toc(el, document.getElementById("toc")); });
  }).catch(function (e) { el.innerHTML = '<p class="note">Could not load this document: ' + N.esc(e.message) + "</p>"; });
})();
</script>
</body>
</html>
